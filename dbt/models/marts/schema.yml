version: 2

models:
  - name: mart_daily_ops
    description: "Daily operational fleet summary: volume, revenue, speed, and trip characteristics"
    columns:
      - name: report_date
        description: "Primary key: calendar date"
        tests:
          - unique
          - not_null
      - name: total_trips
        description: "Total completed trips on this date"
        tests:
          - not_null
      - name: total_revenue
        description: "Sum of total trip revenue (USD)"
        tests:
          - not_null
      - name: avg_fare
        description: "Average base fare (USD)"
      - name: avg_speed_kmh
        description: "Fleet average speed across trips (km/h)"
      - name: peak_hour
        description: "Hour of day (0-23) experiencing peak trip volume"

  - name: mart_zone_perf
    description: "Neighborhood demand and revenue performance by calendar month"
    columns:
      - name: report_month
        description: "First day of the reporting month"
        tests:
          - not_null
      - name: neighborhood_name
        description: "San Francisco neighborhood name"
        tests:
          - not_null
      - name: total_pickups
        description: "Number of trips initiated in this zone"
        tests:
          - not_null
      - name: total_dropoffs
        description: "Number of trips completed in this zone"
        tests:
          - not_null
      - name: revenue_rank
        description: "Rank of the neighborhood by total revenue within the month (1 = highest)"
        tests:
          - not_null

  - name: mart_revenue
    description: "Monthly revenue and unit economics segmented by payment method and taxi fleet company"
    columns:
      - name: report_month
        description: "First day of the reporting month"
        tests:
          - not_null
      - name: payment_type
        description: "Payment method"
        tests:
          - not_null
      - name: company
        description: "Operating taxi company"
        tests:
          - not_null
      - name: total_revenue
        description: "Total gross revenue generated by segment (USD)"
        tests:
          - not_null
      - name: revenue_share_pct
        description: "Segment percentage of total monthly revenue (0 to 100)"
        tests:
          - not_null
