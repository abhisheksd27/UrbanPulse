name: Deploy Infrastructure
# ==============================================================================
# .github/workflows/deploy_infra.yml
# Role: Terraform Apply on Merge to Main
#
# WHAT THIS DOES:
# After a PR is merged to main, automatically applies Terraform changes
# to the DEV environment. PROD deployments require manual approval.
#
# SECURITY:
# AWS credentials are stored as GitHub repository secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, TF_VAR_redshift_master_password
# ==============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'

jobs:
  terraform-deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: dev        # GitHub Environment with protection rules

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -var="environment=dev" -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply tfplan
        env:
          TF_VAR_redshift_master_password: ${{ secrets.REDSHIFT_MASTER_PASSWORD }}
