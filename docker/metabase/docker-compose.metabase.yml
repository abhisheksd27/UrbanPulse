version: '3.8'

services:
  metabase:
    image: metabase/metabase:latest
    container_name: urbanpulse-metabase-standalone
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    restart: unless-stopped

volumes:
  metabase_data:
